<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Quiz App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="quiz-card">
    <h1>🧠 My Quiz App</h1>
    <p class="subtitle">Test your basic computer knowledge!</p>

    <form id="quizForm">
      <section class="question">
        <h2>1. Which language structures a webpage?</h2>
        <label><input type="radio" name="q1" value="a"> A) CSS</label>
        <label><input type="radio" name="q1" value="b"> B) HTML</label>
        <label><input type="radio" name="q1" value="c"> C) Python</label>
      </section>

      <section class="question">
        <h2>2. Which language styles a webpage?</h2>
        <label><input type="radio" name="q2" value="a"> A) CSS</label>
        <label><input type="radio" name="q2" value="b"> B) SQL</label>
        <label><input type="radio" name="q2" value="c"> C) Java</label>
      </section>

      <section class="question">
        <h2>3. Which language adds interactivity?</h2>
        <label><input type="radio" name="q3" value="a"> A) HTML</label>
        <label><input type="radio" name="q3" value="b"> B) CSS</label>
        <label><input type="radio" name="q3" value="c"> C) JavaScript</label>
      </section>

      <section class="question">
        <h2>4. Which one is a web browser?</h2>
        <label><input type="radio" name="q4" value="a"> A) Google Chrome</label>
        <label><input type="radio" name="q4" value="b"> B) MS Word</label>
        <label><input type="radio" name="q4" value="c"> C) Notepad</label>
      </section>

      <section class="question">
        <h2>5. Which is the largest HTML heading tag?</h2>
        <label><input type="radio" name="q5" value="a"> A) &lt;h6&gt;</label>
        <label><input type="radio" name="q5" value="b"> B) &lt;head&gt;</label>
        <label><input type="radio" name="q5" value="c"> C) &lt;h1&gt;</label>
      </section>

      <button type="submit" class="submit-btn">Submit Quiz</button>
      <button type="button" id="restartBtn" class="restart-btn">Restart Quiz</button>
      <p id="result" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
